# docker-compose.yml: # defines how to build and run both the client and server services together.
# here we are using it to run the image only
# Version of the Docker Compose file format. Using '3.8' is a common and stable choice.
version: '3.8'

# 'services' defines the containers for our application.
# Each service will be a separate container.
services:
  # This is the name of our server-side service
  server:
    # not needed files not on server to build
    # Using 'build' instead of 'image' because we have a Dockerfile ---
    # This tells Docker Compose to build the server's image using the Dockerfile
    # in the current directory (`.`), before starting the container.
    build: .
    # 'image' gives a name and tag to the image that will be built.
    # We use 'latest' to indicate it's the most recent build.
    image: ${{ secrets.DOCKERHUB_USERNAME }}/docker-backend:22
    # using service database
    environment:
      # we're now using env variables from our CI/CD pipeline
      # The backend connects to 'mongodb_db' service name, not a URL
      # Inside the Docker network, services find each other by their name.
      - MONGODB_DATABASE_HOST=mongodb_db
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_DB=${MONGODB_DB}
      # The webhook URLs are now pulled from the environment
      - N8N_WEBHOOK_URL_Calendar=${N8N_WEBHOOK_URL_Calendar}
      - N8N_WEBHOOK_URL_Available=${N8N_WEBHOOK_URL_Available}
      - CHATBOT_WEBHOOK_URL=${CHATBOT_WEBHOOK_URL}
      # Other variables are passed through from your .env file
      - PORT=${PORT}
      - API_BASE_URL=${API_BASE_URL}
      - ML_API_URL=${ML_API_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - NODE_ENV=${NODE_ENV}
    # 'ports' maps a port on the host machine to a port in the container.
    # The format is "HOST_PORT:CONTAINER_PORT".
    # This allows us to access the server from our local machine at http://localhost:9000.
    ports:
      - "9000:9000"
    # The 'depends_on' key ensures the server service will not start until
    # the database services are running and healthy.
    # now it also depends on n8n to be up and running
    depends_on:
      - mongodb_db
      - n8n
    # restart when a problem occurs in a container instead of shutting down
    restart: always

  # The MongoDB non-relational database service.
  mongodb_db:
    # Use the official MongoDB image from Docker Hub.
    image: mongo:latest
    # Environment variables for initial setup.
    environment:
      # Set the root user's username. This is for initial access.
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      # Set the root user's password.
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      # Create an initial database on startup.
      MONGO_INITDB_DATABASE: ${MONGODB_DB}
      # The host variable is for a client (like your backend) to connect to the database,
      # not for the database itself to know its own address.
    # Persist data using a named volume.
    volumes:
      - mongodb_data:/data/db
    # Map the standard MongoDB port (27017) to the host.
    ports:
      - "27017:27017"
    # restart when a problem occurs in a container instead of shutting down
    restart: always

  # A new service to run n8n alongside our server and database.
  n8n:
    # ... The n8n service configuration remains unchanged.
    image: n8n.io/n8n
    container_name: n8n
    environment:
      # these are the environment variables n8n needs to work
      # N8N_HOST tells the n8n container its own host name within Docker
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # WEBHOOK_URL is the base URL for n8n to generate its own webhooks
      - WEBHOOK_URL=http://n8n:5678/
      - NODE_ENV=production
    ports:
      - "5678:5678"
    # we need a volume to save our workflows and credentials
    volumes:
      - n8n_data:/home/node/.n8n
    restart: always

# 'volumes' are defined outside the services block.
# This creates a persistent storage space for our database data.
# The volume name is updated to match the MongoDB service.
volumes:
  # dbdata:
  mongodb_data:
  # this is a new volume for our n8n data, so it persists
  n8n_data: